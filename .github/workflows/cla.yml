name: CLA Assistant Lite

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

# Needed so the action can post comments and commit the signatures file
permissions:
  contents: write
  pull-requests: write
  issues: write

# Prevent two CLA runs from racing on the same PR
concurrency:
  group: cla-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: false

jobs:
  cla:
    runs-on: ubuntu-latest
    steps:
      - name: CLA assistant lite
        uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}           # for comments
          PERSONAL_ACCESS_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }} # to push signatures
        with:
          # Where the signatures JSON will live (in this repo on the default branch)
          path-to-signatures: signatures/version1.json
          # Your CLA document
          path-to-document: docs/legal/CLA.md
          # Branch to commit the signatures into (your default branch)
          branch: main
          # Ignore bot accounts
          allowlist: dependabot[bot],github-actions[bot]
          # Use the same repo/org (fine to keep explicit)
          remote-organization-name: FinLang-Ltd
          remote-repository-name: finlang
